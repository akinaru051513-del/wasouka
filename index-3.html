<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>和装家の小物屋</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:#0E0E12;
    color:#F7F4EE;
    font-family:sans-serif;
    padding-bottom:60px;
  }
  a{ color:inherit; text-decoration:none; }

  header{
    background-image:linear-gradient(90deg, rgba(14,14,18,0.6), rgba(14,14,18,0.15) 65%), url('bg-3.jpg');
    background-size:cover;
    background-position:center;
    padding:28px 20px 20px;
    border-bottom:1px solid #23232B;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }
  header .logo-img{
    height:46px;
    display:block;
  }
  .chip{
    display:flex; align-items:center; gap:6px;
    background:rgba(0,0,0,0.55); border:1px solid rgba(255,255,255,0.25);
    color:#F7F4EE; padding:8px 12px; border-radius:20px; font-size:12px;
    cursor:pointer;
  }
  .chip.active{ background:#FF5A36; border-color:#FF5A36; color:#0E0E12; font-weight:700; }

  .error-banner{
    margin:16px 20px 0; background:#3A1D1D; border:1px solid #5A2E2E;
    color:#F7C9C9; padding:10px 14px; border-radius:8px; font-size:13px;
  }
  .seller-bar{
    display:flex; justify-content:space-between; align-items:center;
    background:#1D1D24; margin:16px 20px 0; padding:12px 16px;
    border-radius:10px; border:1px solid #2E2E37;
  }
  .seller-bar span{ font-size:12px; color:#9A968C; }
  .add-btn{
    background:#FF5A36; color:#0E0E12; border:none; padding:9px 14px;
    border-radius:8px; font-weight:700; font-size:13px; cursor:pointer;
  }
  .loading, .empty{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:60px 20px; text-align:center; color:#CFCBC2;
  }
  .grid{
    display:grid; grid-template-columns:repeat(2, 1fr); gap:14px; padding:20px;
  }
  .card{
    position:relative; background:#1D1D24; border:1px solid #2A2A33;
    border-radius:12px; overflow:hidden; cursor:pointer;
  }
  .card-controls{
    position:absolute; top:8px; right:8px; display:flex; gap:6px; z-index:2;
  }
  .icon-btn{
    background:rgba(0,0,0,0.55); border:1px solid rgba(255,255,255,0.2);
    color:#F7F4EE; width:28px; height:28px; border-radius:6px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    font-size:14px;
  }
  .icon-btn.danger{ background:rgba(255,90,54,0.85); color:#0E0E12; }
  .card-img-wrap{ position:relative; }
  .card-img{ width:100%; aspect-ratio:1/1; object-fit:cover; display:block; }
  .card-img-placeholder{
    width:100%; aspect-ratio:1/1; background:#26262F; border:1px dashed #35353F;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:#9A968C;
  }
  .photo-count{
    position:absolute; bottom:6px; right:6px; background:rgba(0,0,0,0.6);
    color:#F7F4EE; font-size:10px; padding:2px 6px; border-radius:10px;
  }
  .card-body{ padding:12px; display:flex; flex-direction:column; gap:6px; }
  .card-price{ font-family:monospace; font-size:16px; color:#FF5A36; font-weight:700; }
  .card-name{ font-size:12px; color:#CFCBC2; }
  .buy-btn{
    margin-top:6px; background:#F7F4EE; color:#0E0E12; border:none;
    padding:9px 0; border-radius:8px; font-weight:700; font-size:12px; cursor:pointer;
  }

  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6);
    display:flex; align-items:flex-end; justify-content:center; z-index:50;
  }
  .modal{
    background:#16161C; border:1px solid #2E2E37; border-radius:16px 16px 0 0;
    padding:22px; width:100%; max-width:480px; max-height:88vh; overflow-y:auto;
  }
  .modal-header{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:8px; font-size:15px; font-weight:700;
  }
  .close-btn{ background:none; border:none; color:#9A968C; font-size:20px; cursor:pointer; }
  .modal-hint{ font-size:12px; color:#9A968C; margin-bottom:8px; }
  .field-label{ display:block; font-size:12px; color:#9A968C; margin-top:10px; margin-bottom:4px; }
  .field-input, .field-textarea{
    width:100%; background:#1D1D24; border:1px solid #2E2E37; color:#F7F4EE;
    padding:10px 12px; border-radius:8px; font-size:14px; font-family:inherit;
  }
  .field-error{ font-size:12px; color:#FF8A6B; margin-top:4px; }
  .primary-btn{
    margin-top:16px; width:100%; background:#FF5A36; color:#0E0E12; border:none;
    padding:13px 0; border-radius:10px; font-weight:700; font-size:14px; cursor:pointer;
  }
  .secondary-btn{
    flex:1; background:#1D1D24; border:1px solid #2E2E37; color:#F7F4EE;
    padding:12px 0; border-radius:10px; font-weight:700; font-size:13px; cursor:pointer;
  }
  .danger-btn{
    flex:1; background:#3A1D1D; border:1px solid #5A2E2E; color:#F7C9C9;
    padding:12px 0; border-radius:10px; font-weight:700; font-size:13px; cursor:pointer;
  }

  .photo-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-bottom:4px; }
  .photo-slot{
    position:relative; aspect-ratio:1/1; border-radius:8px; overflow:hidden;
    background:#1D1D24; border:1px dashed #35353F;
  }
  .photo-slot img{ width:100%; height:100%; object-fit:cover; }
  .photo-remove-btn{
    position:absolute; top:4px; right:4px; background:rgba(0,0,0,0.6); border:none;
    color:#F7F4EE; width:20px; height:20px; border-radius:5px; cursor:pointer; font-size:12px;
  }
  .photo-slot-empty{
    width:100%; height:100%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:4px; padding:4px;
  }
  .photo-action-btn{
    display:flex; align-items:center; gap:3px; background:none; border:none;
    color:#9A968C; font-size:10px; cursor:pointer; padding:2px;
  }
  input[type="file"]{
    position:absolute; width:1px; height:1px; opacity:0; overflow:hidden;
  }

  .detail-main-img{ width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:10px; display:block; }
  .thumb-row{ display:flex; gap:8px; margin-top:8px; }
  .thumb{
    width:56px; height:56px; object-fit:cover; border-radius:8px;
    border:2px solid #2E2E37; cursor:pointer;
  }
  .thumb.active{ border-color:#FF5A36; }
  .detail-price{ font-family:monospace; font-size:22px; color:#FF5A36; font-weight:700; margin-top:14px; }
  .detail-name{ font-size:16px; font-weight:700; margin-top:4px; }
  .detail-desc{ font-size:13px; color:#CFCBC2; line-height:1.7; margin-top:8px; }
  .detail-actions{ display:flex; gap:10px; margin-top:10px; }
</style>
</head>
<body>

  <header>
    <img src="logo-1.png" alt="和装家の小物屋" class="logo-img">
    <button class="chip" id="sellerChip">出品者ログイン</button>
  </header>

  <div id="errorBanner"></div>
  <div id="sellerBar" style="display:none;" class="seller-bar">
    <span>出品者モードで表示中：商品の追加・編集・削除ができます</span>
    <button class="add-btn" id="addBtn">＋ 商品を追加</button>
  </div>

  <div id="content">
    <div class="loading">読み込み中…</div>
  </div>

  <div id="modalRoot"></div>

  <input type="file" accept="image/*" id="passcodeDummy" style="display:none;">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCaadX0IpGvwDs7lgrAXSkH3bz1VDd2xO4",
      authDomain: "wasouka-52c1c.firebaseapp.com",
      projectId: "wasouka-52c1c",
      storageBucket: "wasouka-52c1c.firebasestorage.app",
      messagingSenderId: "447972688964",
      appId: "1:447972688964:web:e5bd1da82977ddcef06811",
      measurementId: "G-39XNM0DM14"
    };

    // ============================================================
    // 出品者モードの合言葉。好きな文字列に変えてください。
    // ※ コードに直接書かれているため本格的なセキュリティにはなりません。
    // ============================================================
    const SELLER_PASSCODE = "youco1973";
    const MAX_PHOTOS = 4;

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const productsCol = collection(db, "products");

    let products = [];
    let isSeller = false;
    let selectedProductId = null;
    let activeImageIndex = 0;
    let draft = { name: "", price: "", description: "", images: [] };
    let editingId = null; // null | 'new' | product id
    let saving = false;

    const contentEl = document.getElementById("content");
    const modalRoot = document.getElementById("modalRoot");
    const sellerChip = document.getElementById("sellerChip");
    const sellerBar = document.getElementById("sellerBar");
    const addBtn = document.getElementById("addBtn");
    const errorBanner = document.getElementById("errorBanner");

    function showError(msg) {
      errorBanner.innerHTML = msg
        ? `<div class="error-banner">${msg}</div>` : "";
    }

    // ---------- Firestore realtime sync ----------
    onSnapshot(productsCol, (snapshot) => {
      products = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }, (err) => {
      showError("データの読み込みに失敗しました: " + err.message);
    });

    // ---------- image compression ----------
    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const maxDim = 900;
            let { width, height } = img;
            if (width > maxDim || height > maxDim) {
              if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
              else { width = Math.round(width * maxDim / height); height = maxDim; }
            }
            const canvas = document.createElement("canvas");
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", 0.72));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // ---------- seller login ----------
    sellerChip.addEventListener("click", () => {
      if (isSeller) {
        isSeller = false;
        render();
        return;
      }
      openPasscodeModal();
    });

    function openPasscodeModal() {
      modalRoot.innerHTML = `
        <div class="overlay" id="ovPass">
          <div class="modal">
            <div class="modal-header">
              <span>出品者ログイン</span>
              <button class="close-btn" id="closePass">✕</button>
            </div>
            <p class="modal-hint">合言葉を入力してください。</p>
            <input type="password" class="field-input" id="passInput" placeholder="合言葉" autofocus>
            <div class="field-error" id="passError" style="display:none;">合言葉が違います。</div>
            <button class="primary-btn" id="submitPass">ログイン</button>
          </div>
        </div>`;
      document.getElementById("ovPass").addEventListener("click", (e) => {
        if (e.target.id === "ovPass") closeModal();
      });
      document.getElementById("closePass").addEventListener("click", closeModal);
      document.getElementById("submitPass").addEventListener("click", submitPasscode);
      document.getElementById("passInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") submitPasscode();
      });
    }

    function submitPasscode() {
      const val = document.getElementById("passInput").value;
      if (val === SELLER_PASSCODE) {
        isSeller = true;
        closeModal();
        render();
      } else {
        document.getElementById("passError").style.display = "block";
      }
    }

    function closeModal() {
      modalRoot.innerHTML = "";
      selectedProductId = null;
      editingId = null;
    }

    // ---------- add / edit form ----------
    addBtn.addEventListener("click", () => {
      draft = { name: "", price: "", description: "", images: [] };
      editingId = "new";
      openFormModal();
    });

    function startEdit(product) {
      draft = {
        name: product.name,
        price: product.price,
        description: product.description || "",
        images: product.images ? [...product.images] : []
      };
      editingId = product.id;
      openFormModal();
    }

    function openFormModal() {
      const slots = Array.from({ length: MAX_PHOTOS }).map((_, i) => {
        const img = draft.images[i];
        if (img) {
          return `
            <div class="photo-slot">
              <img src="${img}">
              <button class="photo-remove-btn" data-remove="${i}">✕</button>
            </div>`;
        }
        return `
          <div class="photo-slot">
            <div class="photo-slot-empty">
              <input type="file" accept="image/*" capture="environment" id="cam-${i}" data-slot="${i}">
              <label for="cam-${i}" class="photo-action-btn">📷 撮影</label>
              <input type="file" accept="image/*" id="gal-${i}" data-slot="${i}">
              <label for="gal-${i}" class="photo-action-btn">🖼 選択</label>
            </div>
          </div>`;
      }).join("");

      modalRoot.innerHTML = `
        <div class="overlay" id="ovForm">
          <div class="modal">
            <div class="modal-header">
              <span>${editingId === "new" ? "商品を追加" : "商品を編集"}</span>
              <button class="close-btn" id="closeForm">✕</button>
            </div>
            <label class="field-label">写真（最大${MAX_PHOTOS}枚）</label>
            <div class="photo-grid">${slots}</div>
            <div class="field-error" id="photoError" style="display:none;"></div>

            <label class="field-label">商品名 *</label>
            <input class="field-input" id="nameInput" value="${draft.name}" placeholder="例）ハンドメイドピアス">

            <label class="field-label">価格（円） *</label>
            <input class="field-input" id="priceInput" value="${draft.price}" placeholder="例）2,980">

            <label class="field-label">説明</label>
            <textarea class="field-textarea" id="descInput" rows="3" placeholder="商品の説明を入力">${draft.description}</textarea>

            <button class="primary-btn" id="submitDraft">${editingId === "new" ? "追加する" : "保存する"}</button>
          </div>
        </div>`;

      document.getElementById("ovForm").addEventListener("click", (e) => {
        if (e.target.id === "ovForm") closeModal();
      });
      document.getElementById("closeForm").addEventListener("click", closeModal);
      document.getElementById("submitDraft").addEventListener("click", submitDraft);

      document.querySelectorAll('[data-remove]').forEach(btn => {
        btn.addEventListener("click", () => {
          const i = Number(btn.dataset.remove);
          draft.images[i] = undefined;
          openFormModal();
        });
      });
      document.querySelectorAll('input[type="file"]').forEach(input => {
        input.addEventListener("change", async (e) => {
          const slotIndex = Number(input.dataset.slot);
          const file = e.target.files[0];
          if (!file) return;
          try {
            const dataUrl = await compressImage(file);
            draft.images[slotIndex] = dataUrl;
            draft.name = document.getElementById("nameInput").value;
            draft.price = document.getElementById("priceInput").value;
            draft.description = document.getElementById("descInput").value;
            openFormModal();
          } catch (err) {
            document.getElementById("photoError").textContent = "写真の読み込みに失敗しました。";
            document.getElementById("photoError").style.display = "block";
          }
        });
      });
    }

    async function submitDraft() {
      const name = document.getElementById("nameInput").value.trim();
      const price = document.getElementById("priceInput").value.trim();
      const description = document.getElementById("descInput").value;
      if (!name || !price) return;
      const cleanImages = draft.images.filter(Boolean);
      const payload = { name, price, description, images: cleanImages };

      try {
        if (editingId === "new") {
          await addDoc(productsCol, payload);
        } else {
          await updateDoc(doc(db, "products", editingId), payload);
        }
        closeModal();
      } catch (err) {
        showError("保存に失敗しました: " + err.message);
      }
    }

    async function deleteProduct(id) {
      if (!confirm("この商品を削除しますか？")) return;
      try {
        await deleteDoc(doc(db, "products", id));
        closeModal();
      } catch (err) {
        showError("削除に失敗しました: " + err.message);
      }
    }

    // ---------- detail view ----------
    function openDetail(product) {
      selectedProductId = product.id;
      activeImageIndex = 0;
      renderDetail();
    }

    function renderDetail() {
      const product = products.find(p => p.id === selectedProductId);
      if (!product) { closeModal(); return; }
      const imgs = product.images || [];
      const mainImg = imgs[activeImageIndex]
        ? `<img src="${imgs[activeImageIndex]}" class="detail-main-img">`
        : `<div class="card-img-placeholder">画像未設定</div>`;
      const thumbs = imgs.length > 1 ? `
        <div class="thumb-row">
          ${imgs.map((img, i) => `<img src="${img}" class="thumb ${i === activeImageIndex ? 'active' : ''}" data-thumb="${i}">`).join("")}
        </div>` : "";

      modalRoot.innerHTML = `
        <div class="overlay" id="ovDetail">
          <div class="modal">
            <div class="modal-header">
              <span>商品の詳細</span>
              <button class="close-btn" id="closeDetail">✕</button>
            </div>
            ${mainImg}
            ${thumbs}
            <div class="detail-price">¥${product.price}</div>
            <div class="detail-name">${product.name}</div>
            ${product.description ? `<p class="detail-desc">${product.description}</p>` : ""}
            <button class="primary-btn" id="buyBtn">購入手続きへ</button>
            ${isSeller ? `
              <div class="detail-actions">
                <button class="secondary-btn" id="editBtn">編集する</button>
                <button class="danger-btn" id="deleteBtn">削除する</button>
              </div>` : ""}
          </div>
        </div>`;

      document.getElementById("ovDetail").addEventListener("click", (e) => {
        if (e.target.id === "ovDetail") closeModal();
      });
      document.getElementById("closeDetail").addEventListener("click", closeModal);
      document.getElementById("buyBtn").addEventListener("click", () => handleBuy(product));
      document.querySelectorAll('[data-thumb]').forEach(t => {
        t.addEventListener("click", () => {
          activeImageIndex = Number(t.dataset.thumb);
          renderDetail();
        });
      });
      if (isSeller) {
        document.getElementById("editBtn").addEventListener("click", () => startEdit(product));
        document.getElementById("deleteBtn").addEventListener("click", () => deleteProduct(product.id));
      }
    }

    function handleBuy(product) {
      // ============================================================
      // ここに決済処理を後付けしてください（product.id / product.name /
      // product.price が使えます）。
      // 例）window.location.href = `https://pay.example.com/checkout?item=${product.id}`;
      // ============================================================
      alert(`「${product.name}」の購入手続きは準備中です。決済リンクをここに追加してください。`);
    }

    // ---------- main render ----------
    function render() {
      sellerChip.textContent = isSeller ? "出品者モード" : "出品者ログイン";
      sellerChip.className = isSeller ? "chip active" : "chip";
      sellerBar.style.display = isSeller ? "flex" : "none";

      if (products.length === 0) {
        contentEl.innerHTML = `
          <div class="empty">
            <p>まだ商品がありません。</p>
            ${isSeller ? '<p style="color:#9A968C;font-size:13px;">「商品を追加」から最初の1品を登録してください。</p>' : ""}
          </div>`;
        return;
      }

      contentEl.innerHTML = `<div class="grid">${products.map(p => {
        const imgs = p.images || [];
        const imgHtml = imgs[0]
          ? `<img src="${imgs[0]}" class="card-img">`
          : `<div class="card-img-placeholder">画像未設定</div>`;
        const countHtml = imgs.length > 1 ? `<span class="photo-count">1/${imgs.length}</span>` : "";
        const controls = isSeller ? `
          <div class="card-controls" data-controls="${p.id}">
            <button class="icon-btn" data-edit="${p.id}">✎</button>
            <button class="icon-btn danger" data-delete="${p.id}">🗑</button>
          </div>` : "";
        return `
          <div class="card" data-open="${p.id}">
            ${controls}
            <div class="card-img-wrap">${imgHtml}${countHtml}</div>
            <div class="card-body">
              <div class="card-price">¥${p.price}</div>
              <div class="card-name">${p.name}</div>
              <button class="buy-btn" data-buy="${p.id}">購入手続きへ</button>
            </div>
          </div>`;
      }).join("")}</div>`;

      document.querySelectorAll('[data-open]').forEach(el => {
        el.addEventListener("click", () => {
          const product = products.find(p => p.id === el.dataset.open);
          if (product) openDetail(product);
        });
      });
      document.querySelectorAll('[data-edit]').forEach(el => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          const product = products.find(p => p.id === el.dataset.edit);
          if (product) startEdit(product);
        });
      });
      document.querySelectorAll('[data-delete]').forEach(el => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          deleteProduct(el.dataset.delete);
        });
      });
      document.querySelectorAll('[data-buy]').forEach(el => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          const product = products.find(p => p.id === el.dataset.buy);
          if (product) handleBuy(product);
        });
      });
    }

    render();
  </script>
</body>
</html>
