<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>和装家の小物屋</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ background:#F7F1E6; }
  body{
    background:transparent;
    color:#3A2E26;
    font-family:sans-serif;
    padding-bottom:60px;
    position:relative;
  }

  .bg-slideshow{
    position:fixed; inset:0; z-index:-1; overflow:hidden;
  }
  .bg-slideshow .slide{
    position:absolute; inset:0;
    background-size:cover; background-position:center;
    opacity:0;
    animation:slideFade 20s infinite;
  }
  .bg-slideshow .slide:nth-child(1){ background-image:url('slide1.jpg'); animation-delay:0s; }
  .bg-slideshow .slide:nth-child(2){ background-image:url('slide2.jpg'); animation-delay:5s; }
  .bg-slideshow .slide:nth-child(3){ background-image:url('slide3.jpg'); animation-delay:10s; }
  .bg-slideshow .slide:nth-child(4){ background-image:url('slide4.jpg'); animation-delay:15s; }
  @keyframes slideFade{
    0%{ opacity:0; }
    5%{ opacity:0.16; }
    20%{ opacity:0.16; }
    25%{ opacity:0; }
    100%{ opacity:0; }
  }
  a{ color:inherit; text-decoration:none; }

  header{
    background-image:linear-gradient(90deg, rgba(14,14,18,0.35), rgba(14,14,18,0.08) 65%), url('bg-pastel.jpg');
    background-size:cover;
    background-position:center;
    padding:28px 20px 20px;
    border-bottom:1px solid #23232B;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }
  header .logo-img{
    height:46px;
    display:block;
  }
  .chip{
    display:flex; align-items:center; gap:6px;
    background:rgba(0,0,0,0.55); border:1px solid rgba(255,255,255,0.25);
    color:#F7F4EE; padding:8px 12px; border-radius:20px; font-size:12px;
    cursor:pointer;
  }
  .chip.active{ background:#FF5A36; border-color:#FF5A36; color:#3A2E26; font-weight:700; }

  .error-banner{
    margin:16px 20px 0; background:#FDEDEB; border:1px solid #F0C4BC;
    color:#B23A2E; padding:10px 14px; border-radius:8px; font-size:13px;
  }
  .seller-bar{
    display:flex; justify-content:space-between; align-items:center;
    background:#FFFFFF; margin:16px 20px 0; padding:12px 16px;
    border-radius:10px; border:1px solid #E8DCC8;
  }
  .seller-bar span{ font-size:12px; color:#9C8B77; }
  .add-btn{
    background:#FF5A36; color:#3A2E26; border:none; padding:9px 14px;
    border-radius:8px; font-weight:700; font-size:13px; cursor:pointer;
  }
  .loading, .empty{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:60px 20px; text-align:center; color:#9C8B77;
  }
  .grid{
    display:grid; grid-template-columns:repeat(2, 1fr); gap:14px; padding:20px;
  }
  .card{
    position:relative; background:#FFFFFF; border:1px solid #E8DCC8;
    border-radius:12px; overflow:hidden; cursor:pointer;
    box-shadow:0 2px 8px rgba(58,46,38,0.06);
  }
  .card-controls{
    position:absolute; top:8px; right:8px; display:flex; gap:6px; z-index:2;
  }
  .icon-btn{
    background:rgba(255,255,255,0.85); border:1px solid #E8DCC8;
    color:#3A2E26; width:28px; height:28px; border-radius:6px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    font-size:14px;
  }
  .icon-btn.danger{ background:rgba(255,90,54,0.9); color:#FFFFFF; }
  .card-img-wrap{ position:relative; }
  .card-img{ width:100%; aspect-ratio:1/1; object-fit:cover; display:block; }
  .card-img-placeholder{
    width:100%; aspect-ratio:1/1; background:#F0E7D8; border:1px dashed #D8C7A8;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:#9C8B77;
  }
  .photo-count{
    position:absolute; bottom:6px; right:6px; background:rgba(58,46,38,0.7);
    color:#FFFFFF; font-size:10px; padding:2px 6px; border-radius:10px;
  }
  .card-body{ padding:12px; display:flex; flex-direction:column; gap:6px; }
  .card-price{ font-family:monospace; font-size:16px; color:#FF5A36; font-weight:700; }
  .card-name{ font-size:12px; color:#6B5D4F; }
  .buy-btn{
    margin-top:6px; background:#3A2E26; color:#FFFFFF; border:none;
    padding:9px 0; border-radius:8px; font-weight:700; font-size:12px; cursor:pointer;
  }
  .buy-btn.sold{ background:#D8CBB8; color:#8A7B6C; cursor:not-allowed; }
  .card.is-sold .card-img{ filter:grayscale(60%); opacity:0.6; }
  .card.is-sold .card-price, .card.is-sold .card-name{ opacity:0.55; }
  .sold-badge{
    position:absolute; top:10px; left:10px;
    background:#3A2E26; color:#FFFFFF; font-weight:700; font-size:11px;
    padding:3px 10px; border-radius:4px; letter-spacing:0.05em;
    transform:rotate(-6deg);
  }

  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6);
    display:flex; align-items:flex-end; justify-content:center; z-index:50;
  }
  .modal{
    background:#FFFFFF; border:1px solid #E8DCC8; border-radius:16px 16px 0 0;
    padding:22px; width:100%; max-width:480px; max-height:88vh; overflow-y:auto;
    box-shadow:0 -4px 20px rgba(58,46,38,0.12);
  }
  .modal-header{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:8px; font-size:15px; font-weight:700;
  }
  .close-btn{ background:none; border:none; color:#9C8B77; font-size:20px; cursor:pointer; }
  .modal-hint{ font-size:12px; color:#9C8B77; margin-bottom:8px; }
  .field-label{ display:block; font-size:12px; color:#9C8B77; margin-top:10px; margin-bottom:4px; }
  .field-input, .field-textarea{
    width:100%; background:#FBF6EC; border:1px solid #E0D3BC; color:#3A2E26;
    padding:10px 12px; border-radius:8px; font-size:14px; font-family:inherit;
  }
  .field-error{ font-size:12px; color:#C0392B; margin-top:4px; }
  .primary-btn{
    margin-top:16px; width:100%; background:#FF5A36; color:#3A2E26; border:none;
    padding:13px 0; border-radius:10px; font-weight:700; font-size:14px; cursor:pointer;
  }
  .secondary-btn{
    flex:1; background:#FBF6EC; border:1px solid #E0D3BC; color:#3A2E26;
    padding:12px 0; border-radius:10px; font-weight:700; font-size:13px; cursor:pointer;
  }
  .danger-btn{
    flex:1; background:#FDEDEB; border:1px solid #F0C4BC; color:#B23A2E;
    padding:12px 0; border-radius:10px; font-weight:700; font-size:13px; cursor:pointer;
  }
  .link-inline-btn{
    background:none; border:none; color:#B0512E; font-size:12px; text-decoration:underline;
    cursor:pointer; padding:2px;
  }

  .photo-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-bottom:4px; }
  .photo-slot{
    position:relative; aspect-ratio:1/1; border-radius:8px; overflow:hidden;
    background:#F0E7D8; border:1px dashed #D8C7A8;
  }
  .photo-slot img{ width:100%; height:100%; object-fit:cover; }
  .photo-remove-btn{
    position:absolute; top:4px; right:4px; background:rgba(58,46,38,0.7); border:none;
    color:#FFFFFF; width:20px; height:20px; border-radius:5px; cursor:pointer; font-size:12px;
  }
  .photo-edit-btn{
    position:absolute; bottom:4px; right:4px; background:rgba(255,90,54,0.85); border:none;
    color:#FFFFFF; width:22px; height:22px; border-radius:5px; cursor:pointer; font-size:12px;
  }
  .photo-slot-empty{
    width:100%; height:100%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:4px; padding:4px;
  }
  .photo-action-btn{
    display:flex; align-items:center; justify-content:center; gap:3px; background:none; border:none;
    color:#9C8B77; font-size:10px; cursor:pointer; padding:4px; text-align:center; white-space:normal;
  }
  input[type="file"]{
    position:absolute; width:1px; height:1px; opacity:0; overflow:hidden;
  }

  .detail-main-img{ width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:10px; display:block; }
  .thumb-row{ display:flex; gap:8px; margin-top:8px; }
  .thumb{
    width:56px; height:56px; object-fit:cover; border-radius:8px;
    border:2px solid #E0D3BC; cursor:pointer;
  }
  .thumb.active{ border-color:#FF5A36; }
  .detail-price{ font-family:monospace; font-size:22px; color:#FF5A36; font-weight:700; margin-top:14px; }
  .detail-name{ font-size:16px; font-weight:700; margin-top:4px; }
  .detail-desc{ font-size:13px; color:#6B5D4F; line-height:1.7; margin-top:8px; }
  .detail-actions{ display:flex; gap:10px; margin-top:10px; }

  .pay-tabs{ display:flex; gap:8px; margin-top:14px; }
  .pay-tab{
    flex:1; background:#FBF6EC; border:1px solid #E0D3BC; color:#3A2E26;
    padding:10px 0; border-radius:8px; font-weight:700; font-size:13px; cursor:pointer;
  }
  .pay-tab.active{ background:#FF5A36; border-color:#FF5A36; color:#3A2E26; }
  .pay-panel{ margin-top:14px; }
  .pay-detail{ font-size:14px; line-height:1.9; color:#3A2E26; }

  .qa-section{ margin-top:20px; padding-top:16px; border-top:1px solid #E8DCC8; }
  .qa-title{ font-size:13px; font-weight:700; color:#3A2E26; margin-bottom:10px; }
  .qa-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; max-height:200px; overflow-y:auto; }
  .qa-item{ background:#FBF6EC; border:1px solid #E8DCC8; border-radius:8px; padding:8px 10px; }
  .qa-item-seller{ background:#FFF3EC; border-color:#F5C7B0; }
  .qa-item-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:3px; }
  .qa-author{ font-size:11px; font-weight:700; color:#9C8B77; }
  .qa-delete-btn{ background:none; border:none; color:#B23A2E; font-size:11px; cursor:pointer; padding:2px 4px; }
  .qa-seller-badge{ background:#FF5A36; color:#3A2E26; font-size:10px; padding:1px 6px; border-radius:8px; font-weight:700; }
  .qa-message{ font-size:13px; color:#3A2E26; line-height:1.6; white-space:pre-wrap; }
</style>
</head>
<body>

  <div class="bg-slideshow">
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
  </div>

  <header>
    <img src="logo-1.png" alt="和装家の小物屋" class="logo-img">
    <button class="chip" id="sellerChip">出品者ログイン</button>
  </header>

  <div id="errorBanner"></div>
  <div id="sellerBar" style="display:none;" class="seller-bar">
    <span>出品者モードで表示中：商品の追加・編集・削除ができます</span>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="add-btn" id="ordersBtn" style="background:#FBF6EC; color:#3A2E26; border:1px solid #E0D3BC;">注文一覧を見る</button>
      <button class="add-btn" id="paymentSettingsBtn" style="background:#FBF6EC; color:#3A2E26; border:1px solid #E0D3BC;">決済情報を設定</button>
      <button class="add-btn" id="addBtn">＋ 商品を追加</button>
    </div>
  </div>

  <div id="content">
    <div class="loading">読み込み中…</div>
  </div>

  <div id="modalRoot"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, setDoc, getDoc, onSnapshot, query, where
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
    import {
      getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCaadX0IpGvwDs7lgrAXSkH3bz1VDd2xO4",
      authDomain: "wasouka-52c1c.firebaseapp.com",
      projectId: "wasouka-52c1c",
      storageBucket: "wasouka-52c1c.firebasestorage.app",
      messagingSenderId: "447972688964",
      appId: "1:447972688964:web:e5bd1da82977ddcef06811",
      measurementId: "G-39XNM0DM14"
    };

    // ============================================================
    // Firebase Authenticationに登録したメールアドレス・パスワードで
    // ログインした人だけが「出品者モード」になれます。
    // ============================================================
    const MAX_PHOTOS = 4;

    // ============================================================
    // EmailJS：注文が入ったときに出品者へ通知メールを送る設定
    // （REST APIを直接呼び出す方式のため、SDKの読み込みは不要）
    // ============================================================
    const EMAILJS_PUBLIC_KEY = "Ydw6-U4cA3hUHG10Y";
    const EMAILJS_SERVICE_ID = "akinaru051513@gmail.com";
    const EMAILJS_TEMPLATE_ID = "template_5bvpyqa";
    const EMAILJS_QUESTION_TEMPLATE_ID = "template_aq9zyuj";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const productsCol = collection(db, "products");
    const questionsCol = collection(db, "questions");
    const ordersCol = collection(db, "orders");
    const customersCol = collection(db, "customers");
    const paymentDocRef = doc(db, "settings", "payment");

    let products = [];
    let isSeller = false;
    let selectedProductId = null;
    let activeImageIndex = 0;
    let draft = { name: "", price: "", description: "", images: [] };
    let editingId = null; // null | 'new' | product id
    let saving = false;

    let paymentInfo = null;
    let paymentDraft = { bankName: "", branchName: "", accountType: "普通", accountNumber: "", accountHolder: "", paypayId: "", paypayLink: "", paypayQr: "" };
    let editingPayment = false;

    let questions = [];
    let unsubscribeQuestions = null;

    let orders = [];
    let unsubscribeOrders = null;
    let buyerDraft = { name: "", postalCode: "", address: "", phone: "", email: "" };

    let currentUser = null;      // ログイン中のFirebaseユーザー（出品者 or 会員）
    let customerProfile = null;  // ログイン中の会員（購入者）の保存済み住所
    let buyerAuthMode = "guest"; // "guest" | "signup" | "login"

    const contentEl = document.getElementById("content");
    const modalRoot = document.getElementById("modalRoot");
    const sellerChip = document.getElementById("sellerChip");
    const sellerBar = document.getElementById("sellerBar");
    const addBtn = document.getElementById("addBtn");
    const errorBanner = document.getElementById("errorBanner");

    function showError(msg) {
      errorBanner.innerHTML = msg
        ? `<div class="error-banner">${msg}</div>` : "";
    }

    // ---------- Firestore realtime sync ----------
    onSnapshot(productsCol, (snapshot) => {
      products = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
      if (selectedProductId) renderDetail();
    }, (err) => {
      showError("データの読み込みに失敗しました: " + err.message);
    });

    onSnapshot(paymentDocRef, (snap) => {
      paymentInfo = snap.exists() ? snap.data() : null;
    }, (err) => {
      showError("決済情報の読み込みに失敗しました: " + err.message);
    });

    // ---------- image compression ----------
    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const maxDim = 900;
            let { width, height } = img;
            if (width > maxDim || height > maxDim) {
              if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
              else { width = Math.round(width * maxDim / height); height = maxDim; }
            }
            const canvas = document.createElement("canvas");
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", 0.72));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // ---------- login (Firebase Authentication) ----------
    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      if (!user) {
        isSeller = false;
        customerProfile = null;
        if (unsubscribeOrders) { unsubscribeOrders(); unsubscribeOrders = null; orders = []; }
        render();
        return;
      }

      try {
        const sellerSnap = await getDoc(doc(db, "sellers", user.uid));
        isSeller = sellerSnap.exists();
      } catch (err) {
        isSeller = false;
      }

      if (isSeller) {
        customerProfile = null;
        if (!unsubscribeOrders) {
          unsubscribeOrders = onSnapshot(ordersCol, (snapshot) => {
            orders = snapshot.docs
              .map(d => ({ id: d.id, ...d.data() }))
              .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            if (document.getElementById("ovOrders")) renderOrdersModal();
          }, (err) => {
            showError("注文情報の読み込みに失敗しました: " + err.message);
          });
        }
      } else {
        try {
          const custSnap = await getDoc(doc(db, "customers", user.uid));
          customerProfile = custSnap.exists() ? custSnap.data() : null;
        } catch (err) {
          customerProfile = null;
        }
        if (unsubscribeOrders) { unsubscribeOrders(); unsubscribeOrders = null; orders = []; }
      }
      render();
      if (document.getElementById("ovBuy")) renderBuyModal();
    });

    sellerChip.addEventListener("click", () => {
      if (isSeller) {
        signOut(auth);
        return;
      }
      openPasscodeModal();
    });

    function openPasscodeModal() {
      modalRoot.innerHTML = `
        <div class="overlay" id="ovPass">
          <div class="modal">
            <div class="modal-header">
              <span>出品者ログイン</span>
              <button class="close-btn" id="closePass">✕</button>
            </div>
            <p class="modal-hint">ログイン用のメールアドレスとパスワードを入力してください。</p>
            <label class="field-label">メールアドレス</label>
            <input type="email" class="field-input" id="emailInput" placeholder="登録したメールアドレス" autofocus>
            <label class="field-label">パスワード</label>
            <input type="password" class="field-input" id="passInput" placeholder="パスワード">
            <div class="field-error" id="passError" style="display:none;">ログインできませんでした。メールアドレスとパスワードをご確認ください。</div>
            <button class="primary-btn" id="submitPass">ログイン</button>
          </div>
        </div>`;
      document.getElementById("ovPass").addEventListener("click", (e) => {
        if (e.target.id === "ovPass") closeModal();
      });
      document.getElementById("closePass").addEventListener("click", closeModal);
      document.getElementById("submitPass").addEventListener("click", submitPasscode);
      document.getElementById("passInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") submitPasscode();
      });
    }

    async function submitPasscode() {
      const email = document.getElementById("emailInput").value.trim();
      const val = document.getElementById("passInput").value;
      try {
        await signInWithEmailAndPassword(auth, email, val);
        closeModal();
      } catch (err) {
        document.getElementById("passError").style.display = "block";
      }
    }

    function closeModal() {
      modalRoot.innerHTML = "";
      selectedProductId = null;
      editingId = null;
      editingPayment = false;
      if (unsubscribeQuestions) { unsubscribeQuestions(); unsubscribeQuestions = null; }
      questions = [];
    }

    // ---------- add / edit form ----------
    addBtn.addEventListener("click", () => {
      draft = { name: "", price: "", description: "", images: [] };
      editingId = "new";
      openFormModal();
    });

    const paymentSettingsBtn = document.getElementById("paymentSettingsBtn");
    paymentSettingsBtn.addEventListener("click", () => {
      paymentDraft = paymentInfo
        ? { ...paymentDraft, ...paymentInfo }
        : { bankName: "", branchName: "", accountType: "普通", accountNumber: "", accountHolder: "", paypayId: "", paypayLink: "", paypayQr: "" };
      editingPayment = true;
      openPaymentSettingsModal();
    });

    const ordersBtn = document.getElementById("ordersBtn");
    ordersBtn.addEventListener("click", () => {
      renderOrdersModal();
    });

    function startEdit(product) {
      draft = {
        name: product.name,
        price: product.price,
        description: product.description || "",
        images: product.images ? [...product.images] : []
      };
      editingId = product.id;
      openFormModal();
    }

    function openFormModal() {
      const slots = Array.from({ length: MAX_PHOTOS }).map((_, i) => {
        const img = draft.images[i];
        if (img) {
          return `
            <div class="photo-slot">
              <img src="${img}">
              <button class="photo-remove-btn" data-remove="${i}">✕</button>
              <button class="photo-edit-btn" data-edit-photo="${i}">✎</button>
            </div>`;
        }
        return `
          <div class="photo-slot">
            <div class="photo-slot-empty">
              <input type="file" accept="image/*" capture="environment" id="cam-${i}" data-slot="${i}">
              <label for="cam-${i}" class="photo-action-btn">📷 撮影</label>
              <input type="file" accept="image/*" id="gal-${i}" data-slot="${i}">
              <label for="gal-${i}" class="photo-action-btn">🖼 選択</label>
            </div>
          </div>`;
      }).join("");

      modalRoot.innerHTML = `
        <div class="overlay" id="ovForm">
          <div class="modal">
            <div class="modal-header">
              <span>${editingId === "new" ? "商品を追加" : "商品を編集"}</span>
              <button class="close-btn" id="closeForm">✕</button>
            </div>
            <label class="field-label">写真（最大${MAX_PHOTOS}枚）</label>
            <div class="photo-grid">${slots}</div>
            <div class="field-error" id="photoError" style="display:none;"></div>

            <label class="field-label">商品名 *</label>
            <input class="field-input" id="nameInput" value="${draft.name}" placeholder="例）ハンドメイドピアス">

            <label class="field-label">価格（円） *</label>

    // ---------- photo editor ----------
    function openPhotoEditor(dataUrl, slotIndex) {
      const editState = { rotation: 0, brightness: 100, contrast: 100, saturation: 100 };

      modalRoot.innerHTML = `
        <div class="overlay" id="ovPhotoEdit">
          <div class="modal">
            <div class="modal-header">
              <span>写真を編集</span>
              <button class="close-btn" id="closePhotoEdit">✕</button>
            </div>
            <canvas id="editCanvas" style="width:100%; border-radius:8px; background:#000; display:block;"></canvas>
            <div style="display:flex; gap:8px; margin-top:10px;">
              <button class="secondary-btn" id="rotateBtn" style="flex:1;">↻ 回転</button>
              <button class="secondary-btn" id="resetEditBtn" style="flex:1;">リセット</button>
            </div>
            <label class="field-label">明るさ</label>
            <input type="range" id="brightnessRange" min="50" max="150" value="100" style="width:100%;">
            <label class="field-label">コントラスト</label>
            <input type="range" id="contrastRange" min="50" max="150" value="100" style="width:100%;">
            <label class="field-label">彩度</label>
            <input type="range" id="saturationRange" min="0" max="200" value="100" style="width:100%;">
            <button class="primary-btn" id="savePhotoEditBtn" style="margin-top:14px;">この内容で保存</button>
          </div>
        </div>`;

      const canvas = document.getElementById("editCanvas");
      const ctx = canvas.getContext("2d");
      const img = new Image();
      img.onload = draw;
      img.src = dataUrl;

      function draw() {
        const rad = (editState.rotation * Math.PI) / 180;
        const swap = editState.rotation % 180 !== 0;
        const w = img.width, h = img.height;
        canvas.width = swap ? h : w;
        canvas.height = swap ? w : h;
        ctx.save();
        ctx.filter = `brightness(${editState.brightness}%) contrast(${editState.contrast}%) saturate(${editState.saturation}%)`;
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate(rad);
        ctx.drawImage(img, -w / 2, -h / 2);
        ctx.restore();
      }

      document.getElementById("rotateBtn").addEventListener("click", () => {
        editState.rotation = (editState.rotation + 90) % 360;
        draw();
      });
      document.getElementById("resetEditBtn").addEventListener("click", () => {
        editState.rotation = 0;
        editState.brightness = 100;
        editState.contrast = 100;
        editState.saturation = 100;
        document.getElementById("brightnessRange").value = 100;
        document.getElementById("contrastRange").value = 100;
        document.getElementById("saturationRange").value = 100;
        draw();
      });
      document.getElementById("brightnessRange").addEventListener("input", (e) => {
        editState.brightness = Number(e.target.value);
        draw();
      });
      document.getElementById("contrastRange").addEventListener("input", (e) => {
        editState.contrast = Number(e.target.value);
        draw();
      });
      document.getElementById("saturationRange").addEventListener("input", (e) => {
        editState.saturation = Number(e.target.value);
        draw();
      });

      document.getElementById("ovPhotoEdit").addEventListener("click", (e) => {
        if (e.target.id === "ovPhotoEdit") openFormModal();
      });
      document.getElementById("closePhotoEdit").addEventListener("click", () => openFormModal());
      document.getElementById("savePhotoEditBtn").addEventListener("click", () => {
        draft.images[slotIndex] = canvas.toDataURL("image/jpeg", 0.85);
        openFormModal();
      });
    }

    // ---------- buy flow (buyer) ----------
    async function sendNotificationEmail(templateId, params) {
      try {
        const mailResponse = await fetch("https://api.emailjs.com/api/v1.0/email/send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            service_id: EMAILJS_SERVICE_ID,
            template_id: templateId,
            user_id: EMAILJS_PUBLIC_KEY,
            template_params: params
          })
        });
        if (!mailResponse.ok) {
          const mailResultText = await mailResponse.text();
          console.error("EmailJS送信エラー:", mailResponse.status, mailResultText);
        }
      } catch (mailErr) {
        console.error("EmailJS送信エラー:", mailErr);
        // メール通知に失敗しても、元の処理自体は完了しているので致命的ではない
      }
    }

        </div>
        ${hasBank ? `
        <div class="pay-panel" data-panel="bank" style="display:${firstTab === "bank" ? "block" : "none"};">
          <p class="pay-detail">
            ${paymentInfo.bankName} ${paymentInfo.branchName}<br>
            ${paymentInfo.accountType} ${paymentInfo.accountNumber}<br>
            ${paymentInfo.accountHolder}
          </p>
        </div>` : ""}
        ${hasPaypay ? `
        <div class="pay-panel" data-panel="paypay" style="display:${firstTab === "paypay" ? "block" : "none"};">
          ${paymentInfo.paypayLink ? `
            <a href="${paymentInfo.paypayLink}" target="_blank" rel="noopener" class="primary-btn" style="display:block; text-align:center; text-decoration:none;">PayPayで支払う</a>
            <p class="modal-hint" style="margin-top:8px;">ボタンを押すとPayPayアプリが開きます。金額を入力して送金してください。</p>
          ` : ""}
          ${paymentInfo.paypayId ? `<p class="pay-detail" style="margin-top:${paymentInfo.paypayLink ? "12px" : "0"};">PayPay ID：${paymentInfo.paypayId}</p>` : ""}
          ${paymentInfo.paypayQr ? `<img src="${paymentInfo.paypayQr}" style="max-width:220px; border-radius:10px; margin-top:8px;">` : ""}
        </div>` : ""}
      `;
    }

    function buildAddressSection() {
      // 会員（購入者）としてログイン中
      if (currentUser && !isSeller) {
        const p = customerProfile || {};
        return `
          <div style="margin-top:16px; padding-top:14px; border-top:1px solid #E8DCC8;">
            <p class="modal-hint" style="margin-bottom:6px;">
              会員としてログイン中：${escapeHtml(currentUser.email || "")}
              　<button class="link-inline-btn" id="buyerLogoutBtn">ログアウト</button>
            </p>
            <label class="field-label">お名前</label>
            <input class="field-input" id="buyerNameInput" value="${escapeHtml(p.name || "")}" placeholder="例）山田 花子">
            <label class="field-label">郵便番号</label>
            <input class="field-input" id="buyerPostalInput" value="${escapeHtml(p.postalCode || "")}" placeholder="例）123-4567">
            <label class="field-label">ご住所</label>
            <input class="field-input" id="buyerAddressInput" value="${escapeHtml(p.address || "")}" placeholder="例）〇〇県〇〇市〇〇1-2-3">
            <label class="field-label">電話番号</label>
            <input class="field-input" id="buyerPhoneInput" value="${escapeHtml(p.phone || "")}" placeholder="例）090-1234-5678">
            <div class="field-error" id="buyerError" style="display:none;"></div>
            <button class="primary-btn" id="submitOrderBtn" style="margin-top:12px;">この内容で注文を確定する</button>
            <p class="modal-hint" id="orderDoneMsg" style="display:none; margin-top:10px; color:#3A2E26; font-weight:700;">送信しました。出品者からの連絡をお待ちください。</p>
          </div>`;
      }

      // ゲスト購入（アカウントなし）
      if (buyerAuthMode === "guest") {
        return `
          <div style="margin-top:16px; padding-top:14px; border-top:1px solid #E8DCC8;">
            <p class="modal-hint" style="margin-bottom:6px;">お届け先（出品者にだけ表示されます）</p>
            <label class="field-label">お名前</label>
            <input class="field-input" id="buyerNameInput" value="${escapeHtml(buyerDraft.name)}" placeholder="例）山田 花子">
            <label class="field-label">郵便番号</label>
            <input class="field-input" id="buyerPostalInput" value="${escapeHtml(buyerDraft.postalCode)}" placeholder="例）123-4567">
            <label class="field-label">ご住所</label>
            <input class="field-input" id="buyerAddressInput" value="${escapeHtml(buyerDraft.address)}" placeholder="例）〇〇県〇〇市〇〇1-2-3">
            <label class="field-label">電話番号</label>
            <input class="field-input" id="buyerPhoneInput" value="${escapeHtml(buyerDraft.phone)}" placeholder="例）090-1234-5678">
            <label class="field-label">メールアドレス（発送のお知らせをお送りします）</label>
            <input type="email" class="field-input" id="buyerEmailInput" value="${escapeHtml(buyerDraft.email || "")}" placeholder="例）example@mail.com">
            <div class="field-error" id="buyerError" style="display:none;"></div>
            <button class="primary-btn" id="submitOrderBtn" style="margin-top:12px;">ゲストとして注文を確定する</button>
            <p class="modal-hint" id="orderDoneMsg" style="display:none; margin-top:10px; color:#3A2E26; font-weight:700;">送信しました。出品者からの連絡をお待ちください。</p>
            <p class="modal-hint" style="margin-top:14px; text-align:center;">
              <button class="link-inline-btn" id="switchToSignup">会員登録して次回から住所を自動入力する ▸</button>
            </p>
            <p class="modal-hint" style="margin-top:6px; text-align:center;">
              <button class="link-inline-btn" id="switchToLogin">すでに会員登録済みの方はこちら</button>
            </p>
          </div>`;
      }

      // 会員登録して購入
      if (buyerAuthMode === "signup") {
        return `
          <div style="margin-top:16px; padding-top:14px; border-top:1px solid #E8DCC8;">
            <p class="modal-hint" style="margin-bottom:6px;">会員登録して購入（次回から住所が自動入力されます）</p>
            <label class="field-label">お名前</label>
            <input class="field-input" id="buyerNameInput" value="${escapeHtml(buyerDraft.name)}" placeholder="例）山田 花子">
            <label class="field-label">郵便番号</label>
            <input class="field-input" id="buyerPostalInput" value="${escapeHtml(buyerDraft.postalCode)}" placeholder="例）123-4567">
            <label class="field-label">ご住所</label>
            <input class="field-input" id="buyerAddressInput" value="${escapeHtml(buyerDraft.address)}" placeholder="例）〇〇県〇〇市〇〇1-2-3">
            <label class="field-label">電話番号</label>
            <input class="field-input" id="buyerPhoneInput" value="${escapeHtml(buyerDraft.phone)}" placeholder="例）090-1234-5678">
            <label class="field-label">メールアドレス</label>
            <input type="email" class="field-input" id="buyerEmailInput" placeholder="ログインに使うメールアドレス">
            <label class="field-label">パスワード</label>
            <input type="password" class="field-input" id="buyerPasswordInput" placeholder="6文字以上">
            <div class="field-error" id="buyerError" style="display:none;"></div>
            <button class="primary-btn" id="submitOrderBtn" style="margin-top:12px;">登録して注文を確定する</button>
            <p class="modal-hint" id="orderDoneMsg" style="display:none; margin-top:10px; color:#3A2E26; font-weight:700;">送信しました。出品者からの連絡をお待ちください。</p>
            <p class="modal-hint" style="margin-top:14px; text-align:center;">
              <button class="link-inline-btn" id="switchToGuest">◂ 会員登録せずゲストとして購入する</button>
            </p>
          </div>`;
      }

      // 既存会員のログイン
      return `
        <div style="margin-top:16px; padding-top:14px; border-top:1px solid #E8DCC8;">
          <p class="modal-hint" style="margin-bottom:6px;">会員ログイン（保存済みの住所を呼び出します）</p>
          <label class="field-label">メールアドレス</label>
          <input type="email" class="field-input" id="buyerLoginEmailInput" placeholder="登録したメールアドレス">
          <label class="field-label">パスワード</label>
          <input type="password" class="field-input" id="buyerLoginPasswordInput" placeholder="パスワード">
          <div class="field-error" id="buyerLoginError" style="display:none;">ログインできませんでした。メールアドレスとパスワードをご確認ください。</div>
          <button class="primary-btn" id="buyerLoginBtn" style="margin-top:12px;">ログインする</button>
          <p class="modal-hint" style="margin-top:14px; text-align:center;">
            <button class="link-inline-btn" id="switchToGuest">◂ 会員登録せずゲストとして購入する</button>
          </p>
        </div>`;
    }

    function renderBuyModal() {
      const product = currentBuyProduct;
      modalRoot.innerHTML = `
        <div class="overlay" id="ovBuy">
          <div class="modal">
            <div class="modal-header">
              <span>購入手続き</span>
              <button class="close-btn" id="closeBuy">✕</button>
            </div>
            <div class="detail-price">¥${product.price}</div>
            <div class="detail-name">${product.name}</div>
            ${buildPaymentBody()}
            ${buildAddressSection()}
          </div>
        </div>`;

      document.getElementById("ovBuy").addEventListener("click", (e) => {
        if (e.target.id === "ovBuy") closeModal();
      });
      document.getElementById("closeBuy").addEventListener("click", closeModal);
      document.querySelectorAll(".pay-tab").forEach(tab => {
        tab.addEventListener("click", () => {
          document.querySelectorAll(".pay-tab").forEach(t => t.classList.remove("active"));
          tab.classList.add("active");
          document.querySelectorAll(".pay-panel").forEach(p => {
            p.style.display = p.dataset.panel === tab.dataset.tab ? "block" : "none";
          });
        });
      });

      const switchToSignup = document.getElementById("switchToSignup");
      if (switchToSignup) switchToSignup.addEventListener("click", () => { saveDraftFromInputs(); buyerAuthMode = "signup"; renderBuyModal(); });
      const switchToLogin = document.getElementById("switchToLogin");
      if (switchToLogin) switchToLogin.addEventListener("click", () => { saveDraftFromInputs(); buyerAuthMode = "login"; renderBuyModal(); });
      const switchToGuest = document.getElementById("switchToGuest");
      if (switchToGuest) switchToGuest.addEventListener("click", () => { buyerAuthMode = "guest"; renderBuyModal(); });

      const logoutBtn = document.getElementById("buyerLogoutBtn");
      if (logoutBtn) logoutBtn.addEventListener("click", () => signOut(auth));

      const submitBtn = document.getElementById("submitOrderBtn");
      if (submitBtn) submitBtn.addEventListener("click", submitOrder);

      const loginBtn = document.getElementById("buyerLoginBtn");
      if (loginBtn) loginBtn.addEventListener("click", submitBuyerLogin);
    }

    function saveDraftFromInputs() {
      const n = document.getElementById("buyerNameInput");
      const pc = document.getElementById("buyerPostalInput");
      const a = document.getElementById("buyerAddressInput");
      const ph = document.getElementById("buyerPhoneInput");
      const em = document.getElementById("buyerEmailInput");
      if (n) buyerDraft = {
        name: n.value, postalCode: pc.value, address: a.value, phone: ph.value,
        email: em ? em.value : (buyerDraft.email || "")
      };
    }

    async function submitBuyerLogin() {
      const errorEl = document.getElementById("buyerLoginError");
      const email = document.getElementById("buyerLoginEmailInput").value.trim();
      const password = document.getElementById("buyerLoginPasswordInput").value;
      const btn = document.getElementById("buyerLoginBtn");
      btn.disabled = true;
      btn.textContent = "ログイン中…";
      try {
        await signInWithEmailAndPassword(auth, email, password);
        // onAuthStateChanged が customerProfile を読み込んでから renderBuyModal() を呼び直す
      } catch (err) {
        errorEl.style.display = "block";
        btn.disabled = false;
        btn.textContent = "ログインする";
      }
    }

    async function submitOrder() {
      const product = currentBuyProduct;
      const errorEl = document.getElementById("buyerError");
      const name = document.getElementById("buyerNameInput").value.trim();
      const postalCode = document.getElementById("buyerPostalInput").value.trim();
      const address = document.getElementById("buyerAddressInput").value.trim();
      const phone = document.getElementById("buyerPhoneInput").value.trim();
      const emailInputEl = document.getElementById("buyerEmailInput");
      const guestEmail = emailInputEl ? emailInputEl.value.trim() : "";

      if (!name || !address || !phone) {
        errorEl.textContent = "お名前・ご住所・電話番号は必須です。";
        errorEl.style.display = "block";
        return;
      }

      let signupEmail = null, signupPassword = null;
      if (!currentUser && buyerAuthMode === "signup") {
        signupEmail = document.getElementById("buyerEmailInput").value.trim();
        signupPassword = document.getElementById("buyerPasswordInput").value;
        if (!signupEmail || signupPassword.length < 6) {
          errorEl.textContent = "メールアドレスと6文字以上のパスワードを入力してください。";
          errorEl.style.display = "block";
          return;
        }
      }

      const buyerEmail = (currentUser && !isSeller) ? (currentUser.email || "") : (signupEmail || guestEmail);

      const btn = document.getElementById("submitOrderBtn");
      btn.disabled = true;
      btn.textContent = "送信中…";

      try {
        let buyerUid = currentUser && !isSeller ? currentUser.uid : null;

        if (signupEmail) {
          const cred = await createUserWithEmailAndPassword(auth, signupEmail, signupPassword);
          buyerUid = cred.user.uid;
        }

        if (buyerUid) {
          await setDoc(doc(db, "customers", buyerUid), { name, postalCode, address, phone, email: buyerEmail }, { merge: true });
        }

        await addDoc(ordersCol, {
          productId: product.id,
          productName: product.name,
          price: product.price,
          name, postalCode, address, phone,
          email: buyerEmail || null,
          buyerUid: buyerUid || null,
          createdAt: Date.now()
        });

        try {
          await updateDoc(doc(db, "products", product.id), { sold: true });
        } catch (soldErr) {
          // 売り切れ表示への更新に失敗しても、注文自体は完了しているので致命的ではない
        }

        await sendNotificationEmail(EMAILJS_TEMPLATE_ID, {
          product_name: product.name,
          price: product.price,
          buyer_name: name,
          postal_code: postalCode,
          address: address,
          phone: phone
        });

        document.getElementById("orderDoneMsg").style.display = "block";
        btn.style.display = "none";
      } catch (err) {
        errorEl.textContent = "送信に失敗しました: " + err.message;
        errorEl.style.display = "block";
        btn.disabled = false;
        btn.textContent = "この内容で注文を確定する";
      }
    }

    // ---------- main render ----------
    function render() {
      sellerChip.textContent = isSeller ? "出品者モード" : "出品者ログイン";
      sellerChip.className = isSeller ? "chip active" : "chip";
      sellerBar.style.display = isSeller ? "flex" : "none";

      if (products.length === 0) {
        contentEl.innerHTML = `
          <div class="empty">
            <p>まだ商品がありません。</p>
            ${isSeller ? '<p style="color:#9C8B77;font-size:13px;">「商品を追加」から最初の1品を登録してください。</p>' : ""}
          </div>`;
        return;
      }

      contentEl.innerHTML = `<div class="grid">${products.map(p => {
        const imgs = p.images || [];
        const imgHtml = imgs[0]
          ? `<img src="${imgs[0]}" class="card-img">`
          : `<div class="card-img-placeholder">画像未設定</div>`;
        const countHtml = imgs.length > 1 ? `<span class="photo-count">1/${imgs.length}</span>` : "";
        const soldHtml = p.sold ? `<div class="sold-badge">SOLD</div>` : "";
        const controls = isSeller ? `
          <div class="card-controls" data-controls="${p.id}">
            <button class="icon-btn" data-sold="${p.id}" title="${p.sold ? "販売中に戻す" : "売り切れにする"}">${p.sold ? "↺" : "済"}</button>
            <button class="icon-btn" data-edit="${p.id}">✎</button>
            <button class="icon-btn danger" data-delete="${p.id}">🗑</button>
          </div>` : "";
        const buyBtnHtml = p.sold
          ? `<button class="buy-btn sold" disabled>売り切れました</button>`
          : `<button class="buy-btn" data-buy="${p.id}">購入手続きへ</button>`;
        return `
          <div class="card ${p.sold ? "is-sold" : ""}" data-open="${p.id}">
            ${controls}
            <div class="card-img-wrap">${imgHtml}${countHtml}${soldHtml}</div>
            <div class="card-body">
              <div class="card-price">¥${p.price}</div>
              <div class="card-name">${p.name}</div>
              ${buyBtnHtml}
            </div>
          </div>`;
      }).join("")}</div>`;

      document.querySelectorAll('[data-open]').forEach(el => {
        el.addEventListener("click", () => {
          const product = products.find(p => p.id === el.dataset.open);
          if (product) openDetail(product);
        });
      });
      document.querySelectorAll('[data-edit]').forEach(el => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          const product = products.find(p => p.id === el.dataset.edit);
          if (product) startEdit(product);
        });
      });
      document.querySelectorAll('[data-delete]').forEach(el => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          deleteProduct(el.dataset.delete);
        });
      });
      document.querySelectorAll('[data-sold]').forEach(el => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          const product = products.find(p => p.id === el.dataset.sold);
          if (product) toggleSold(product);
        });
      });
      document.querySelectorAll('[data-buy]').forEach(el => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          const product = products.find(p => p.id === el.dataset.buy);
          if (product) handleBuy(product);
        });
      });
    }

    async function toggleSold(product) {
      try {
        await updateDoc(doc(db, "products", product.id), { sold: !product.sold });
      } catch (err) {
        showError("更新に失敗しました: " + err.message);
      }
    }

    render();
  </script>
</body>
</html>
