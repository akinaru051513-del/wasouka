<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>和装家の小物屋</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:#0E0E12;
    color:#F7F4EE;
    font-family:sans-serif;
    padding-bottom:60px;
  }
  a{ color:inherit; text-decoration:none; }

  header{
    background-image:linear-gradient(90deg, rgba(14,14,18,0.6), rgba(14,14,18,0.15) 65%), url('bg.jpg');
    background-size:cover;
    background-position:center;
    padding:28px 20px 20px;
    border-bottom:1px solid #23232B;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }
  header .logo-img{
    height:46px;
    display:block;
  }
  .chip{
    display:flex; align-items:center; gap:6px;
    background:rgba(0,0,0,0.55); border:1px solid rgba(255,255,255,0.25);
    color:#F7F4EE; padding:8px 12px; border-radius:20px; font-size:12px;
    cursor:pointer;
  }
  .chip.active{ background:#FF5A36; border-color:#FF5A36; color:#0E0E12; font-weight:700; }

  .error-banner{
    margin:16px 20px 0; background:#3A1D1D; border:1px solid #5A2E2E;
    color:#F7C9C9; padding:10px 14px; border-radius:8px; font-size:13px;
  }
  .seller-bar{
    display:flex; justify-content:space-between; align-items:center;
    background:#1D1D24; margin:16px 20px 0; padding:12px 16px;
    border-radius:10px; border:1px solid #2E2E37;
  }
  .seller-bar span{ font-size:12px; color:#9A968C; }
  .add-btn{
    background:#FF5A36; color:#0E0E12; border:none; padding:9px 14px;
    border-radius:8px; font-weight:700; font-size:13px; cursor:pointer;
  }
  .loading, .empty{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:60px 20px; text-align:center; color:#CFCBC2;
  }
  .grid{
    display:grid; grid-template-columns:repeat(2, 1fr); gap:14px; padding:20px;
  }
  .card{
    position:relative; background:#1D1D24; border:1px solid #2A2A33;
    border-radius:12px; overflow:hidden; cursor:pointer;
  }
  .card-controls{
    position:absolute; top:8px; right:8px; display:flex; gap:6px; z-index:2;
  }
  .icon-btn{
    background:rgba(0,0,0,0.55); border:1px solid rgba(255,255,255,0.2);
    color:#F7F4EE; width:28px; height:28px; border-radius:6px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    font-size:14px;
  }
  .icon-btn.danger{ background:rgba(255,90,54,0.85); color:#0E0E12; }
  .card-img-wrap{ position:relative; }
  .card-img{ width:100%; aspect-ratio:1/1; object-fit:cover; display:block; }
  .card-img-placeholder{
    width:100%; aspect-ratio:1/1; background:#26262F; border:1px dashed #35353F;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:#9A968C;
  }
  .photo-count{
    position:absolute; bottom:6px; right:6px; background:rgba(0,0,0,0.6);
    color:#F7F4EE; font-size:10px; padding:2px 6px; border-radius:10px;
  }
  .card-body{ padding:12px; display:flex; flex-direction:column; gap:6px; }
  .card-price{ font-family:monospace; font-size:16px; color:#FF5A36; font-weight:700; }
  .card-name{ font-size:12px; color:#CFCBC2; }
  .buy-btn{
    margin-top:6px; background:#F7F4EE; color:#0E0E12; border:none;
    padding:9px 0; border-radius:8px; font-weight:700; font-size:12px; cursor:pointer;
  }

  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6);
    display:flex; align-items:flex-end; justify-content:center; z-index:50;
  }
  .modal{
    background:#16161C; border:1px solid #2E2E37; border-radius:16px 16px 0 0;
    padding:22px; width:100%; max-width:480px; max-height:88vh; overflow-y:auto;
  }
  .modal-header{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:8px; font-size:15px; font-weight:700;
  }
  .close-btn{ background:none; border:none; color:#9A968C; font-size:20px; cursor:pointer; }
  .modal-hint{ font-size:12px; color:#9A968C; margin-bottom:8px; }
  .field-label{ display:block; font-size:12px; color:#9A968C; margin-top:10px; margin-bottom:4px; }
  .field-input, .field-textarea{
    width:100%; background:#1D1D24; border:1px solid #2E2E37; color:#F7F4EE;
    padding:10px 12px; border-radius:8px; font-size:14px; font-family:inherit;
  }
  .field-error{ font-size:12px; color:#FF8A6B; margin-top:4px; }
  .primary-btn{
    margin-top:16px; width:100%; background:#FF5A36; color:#0E0E12; border:none;
    padding:13px 0; border-radius:10px; font-weight:700; font-size:14px; cursor:pointer;
  }
  .secondary-btn{
    flex:1; background:#1D1D24; border:1px solid #2E2E37; color:#F7F4EE;
    padding:12px 0; border-radius:10px; font-weight:700; font-size:13px; cursor:pointer;
  }
  .danger-btn{
    flex:1; background:#3A1D1D; border:1px solid #5A2E2E; color:#F7C9C9;
    padding:12px 0; border-radius:10px; font-weight:700; font-size:13px; cursor:pointer;
  }

  .photo-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-bottom:4px; }
  .photo-slot{
    position:relative; aspect-ratio:1/1; border-radius:8px; overflow:hidden;
    background:#1D1D24; border:1px dashed #35353F;
  }
  .photo-slot img{ width:100%; height:100%; object-fit:cover; }
  .photo-remove-btn{
    position:absolute; top:4px; right:4px; background:rgba(0,0,0,0.6); border:none;
    color:#F7F4EE; width:20px; height:20px; border-radius:5px; cursor:pointer; font-size:12px;
  }
  .photo-slot-empty{
    width:100%; height:100%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:4px; padding:4px;
  }
  .photo-action-btn{
    display:flex; align-items:center; gap:3px; background:none; border:none;
    color:#9A968C; font-size:10px; cursor:pointer; padding:2px;
  }
  input[type="file"]{
    position:absolute; width:1px; height:1px; opacity:0; overflow:hidden;
  }

  .detail-main-img{ width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:10px; display:block; }
  .thumb-row{ display:flex; gap:8px; margin-top:8px; }
  .thumb{
    width:56px; height:56px; object-fit:cover; border-radius:8px;
    border:2px solid #2E2E37; cursor:pointer;
  }
  .thumb.active{ border-color:#FF5A36; }
  .detail-price{ font-family:monospace; font-size:22px; color:#FF5A36; font-weight:700; margin-top:14px; }
  .detail-name{ font-size:16px; font-weight:700; margin-top:4px; }
  .detail-desc{ font-size:13px; color:#CFCBC2; line-height:1.7; margin-top:8px; }
  .detail-actions{ display:flex; gap:10px; margin-top:10px; }
</style>
</head>

    <button class="add-btn" id="addBtn">＋ 商品を追加</button>
  </div>

  <div id="content">
    <div class="loading">読み込み中…</div>
  </div>

  <input type="file" accept="image/*" id="passcodeDummy" style="display:none;">
